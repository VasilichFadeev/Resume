<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Резюме</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="scripts/scroll_blur.js" defer></script>
  </head>

  <body>
    <div class="bg"></div>
    <div class="bg bg--blur"></div>

    <div class="greeting">
      <div class="greeting-text">Привет</div>
      <div class="greeting-blur">Привет</div>
    </div>

    <div class="section" id="section-1">
      <section class="about">
        <div class="about-photo">
          <img src="images/me.jpeg" alt="Я" />
        </div>

        <div class="about-title">
          <h1>Я Василий Фадеев,</h1>
        </div>

        <div class="about-description">
          <p>
            Frontend-разработчик, создающий интерфейсы, которыми хочется
            пользоваться.
          </p>
        </div>
      </section>
    </div>

    <div class="scroll-hint">
      <img src="images/down_arrow.svg" alt="" class="arrow arrow-1" />
      <img src="images/down_arrow.svg" alt="" class="arrow arrow-2" />
      <img src="images/down_arrow.svg" alt="" class="arrow arrow-3" />
    </div>
  </body>
</html>
